<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#0e1b2c;--mu:#5d6c80;--ln:#dde4ee;--pr:#0b2a4a;--ac:#0e9a8a;--dg:#d03a47;--sd:0 2px 10px rgba(11,42,74,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09121d;--card:#122033;--tx:#e8eef6;--mu:#8fa1b8;--ln:#223550;--pr:#1d5a96;--ac:#27c4b1;--dg:#ff6b78;--sd:none}}
:root[data-theme="dark"]{--bg:#09121d;--card:#122033;--tx:#e8eef6;--mu:#8fa1b8;--ln:#223550;--pr:#1d5a96;--ac:#27c4b1;--dg:#ff6b78;--sd:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.hid #app,.hid #nav{filter:blur(24px)}
h1{font-size:24px;margin:6px 0 14px;letter-spacing:-.3px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sd);border:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,#0b2a4a,#0f5f78 70%,#0e9a8a);color:#fff;border:0}.hero .mu{color:#c9deec}
.big{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:2px 0}
.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
button{font-family:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--pr);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;margin-top:8px}
.btn.dg{background:var(--dg)}.btn:disabled{opacity:.6}
.chip{background:transparent;border:1px solid var(--ln);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600}
.lk{background:none;border:0;color:var(--ac);font-size:16px;font-weight:600;padding:6px 0}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:6px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;margin:6px 0 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mu);margin-top:4px}
.av{width:42px;height:42px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bar{height:8px;background:var(--ln);border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);background:none;color:#fff;font-size:14px;padding:0;flex:none}.ck.on{background:var(--ac);border-color:var(--ac)}
.todo{padding:12px 14px}.dn .tx{text-decoration:line-through;color:var(--mu)}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 0}#nav .on{color:var(--ac);font-weight:600}
.ovl{position:fixed;inset:0;background:rgba(5,12,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.tw{max-height:260px;overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--card);color:var(--mu)}
.lock{min-height:82vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#0b2a4a,#0e9a8a);color:#fff;display:grid;place-items:center}
.err{color:var(--dg);font-size:13px;min-height:18px;margin-bottom:4px}
.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;margin-top:4px}
.t{fill:var(--mu);font-size:10px}
</style></head><body>

<script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
let memOnly=false;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){memOnly=true;return false}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const kr=n=>Math.round(n||0).toLocaleString('sv-SE')+' kr';
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Array.from(crypto.getRandomValues(new Uint32Array(2))).join('');
const end=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleDateString('sv-SE',{month:'short',year:'numeric'})};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ic=(p,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
const TABS=[['ov','Översikt','M4 20V10M10 20V4M16 20v-8M22 20H2'],['pe','Personer','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'],['no','Anteckningar','M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5'],['td','Att göra','M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'],['se','Inställningar','M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z']];
/* ---------- Kryptering: PBKDF2 (600 000 varv) -> AES-256-GCM ---------- */
let KEY,SALT,IT=6e5,DB,S={tab:'ov'},last=Date.now(),hidAt=0,q=Promise.resolve();
const dk=async(pw,s,it)=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:it,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const seal=async()=>{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(DB)));ls.set('fm_v',JSON.stringify({v:1,it:IT,s:b64(SALT),iv:b64(iv),ct:b64(ct)}))};
const save=()=>{q=q.then(()=>KEY?seal():0).catch(()=>{})};
const unseal=async(pw,v)=>{const s=ub64(v.s),k=await dk(pw,s,v.it),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(v.iv)},k,ub64(v.ct));const db=JSON.parse(dec.decode(pt));db.people||=[];db.notes||=[];db.todos||=[];return{k,s,it:v.it,db}};
async function login(pw){const f=+ls.get('fm_f')||0,u=+ls.get('fm_u')||0;if(Date.now()<u)return 'Vänta '+Math.ceil((u-Date.now())/1000)+' s innan nästa försök.';
 try{const r=await unseal(pw,JSON.parse(ls.get('fm_v')));KEY=r.k;SALT=r.s;IT=r.it;DB=r.db;ls.set('fm_f','0');return ''}
 catch(e){const n=f+1;ls.set('fm_f',String(n));if(n>=3)ls.set('fm_u',String(Date.now()+Math.min(2**(n-3)*15,900)*1000));return 'Fel lösenord.'+(n>=3?' Väntetid aktiverad.':'')}}
function lock(){KEY=null;DB=null;S={tab:'ov'};document.querySelectorAll('.ovl').forEach(o=>o.remove());lockUI()}
function lockUI(){const first=!ls.get('fm_v');$('nav').innerHTML='';
 $('app').innerHTML=`<div class="lock"><div class="logo">${ic('M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',34)}</div><h1>Kapital</h1><p class="mu">${first?'Skapa ett starkt lösenord (minst 10 tecken). Det går inte att återställa om du glömmer det.':'Ange ditt lösenord för att låsa upp.'}</p><input id="p1" type="password" placeholder="Lösenord" autocomplete="${first?'new-password':'current-password'}">${first?'<input id="p2" type="password" placeholder="Upprepa lösenord" autocomplete="new-password">':''}<div class="err" id="er"></div><button class="btn" id="go">${first?'Skapa kassaskåp':'Lås upp'}</button>${first?'<button class="lk" id="rs" style="margin-top:14px">Återställ från säkerhetskopia</button>':''}</div>`;
 if(first)$('rs').onclick=restoreLock;
 const go=$('go'),lbl=first?'Skapa kassaskåp':'Lås upp';
 const run=async()=>{const p=$('p1').value;go.disabled=true;go.textContent='Arbetar…';let er='';
  if(first){if(p.length<10)er='Minst 10 tecken.';else if(p!==$('p2').value)er='Lösenorden matchar inte.';else{SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await dk(p,SALT,IT);DB={people:[{id:'me',name:'Jag',inc:0,info:'',debts:[]}],notes:[],todos:[]};await seal()}}
  else er=await login(p);
  if(er){$('er').textContent=er;go.disabled=false;go.textContent=lbl;return}
  S={tab:'ov'};last=Date.now();render()};
 go.onclick=run;[...document.querySelectorAll('.lock input')].pop().onkeydown=e=>{if(e.key==='Enter')run()}}
function restoreLock(){sheet('Återställ från kopia',[{t:'msg',l:'Klistra in den krypterade säkerhetskopian och ange dess lösenord.'},{k:'v',l:'Klistra in kopian',t:'area',r:5},{k:'p',l:'Lösenord för kopian',t:'password'}],'Återställ',async v=>{try{const r=await unseal(v.p,JSON.parse(v.v.trim()));KEY=r.k;SALT=r.s;IT=r.it;DB=r.db;await seal();S={tab:'ov'};last=Date.now();render()}catch(x){return 'Fel lösenord eller ogiltig kopia.'}})}
/* ---------- Beräkningar ---------- */
function plan(d){let b=+d.amount,i=d.rate/1200,p=+d.pay,r=[],t=0,dt=new Date();dt.setDate(1);
 if(b<=0)return{r,t:0,ok:true};if(p<=b*i+0.005)return{r,t:0,ok:false};
 for(let m=1;m<=600&&b>0.005;m++){const it=b*i,a=Math.min(p-it,b);b-=a;t+=it;dt.setMonth(dt.getMonth()+1);r.push({d:new Date(dt),i:it,a,b:Math.max(b,0)})}
 return{r,t,ok:true}}
function series(ds){const ps=ds.map(plan);let n=Math.max(0,...ps.map(p=>p.r.length));const bad=ps.some(p=>!p.ok);if(bad)n=Math.max(n,60);
 const v=[ds.reduce((s,d)=>s+ +d.amount,0)];for(let m=0;m<n;m++)v.push(ps.reduce((s,p,i)=>s+(p.ok?(p.r[m]?p.r[m].b:0):+ds[i].amount),0));
 return{v,n,t:ps.reduce((s,p)=>s+p.t,0),bad}}
const tot=p=>p.debts.reduce((s,d)=>s+ +d.amount,0),mon=p=>p.debts.reduce((s,d)=>s+ +d.pay,0);
const sm=v=>{if(v.length<=60)return v;const k=(v.length-1)/59;return Array.from({length:60},(_,i)=>v[Math.round(i*k)])};
/* ---------- Diagram (SVG) ---------- */
const COL=['#0e9a8a','#1d6fb8','#e0a030','#8a5cd6','#d03a47','#4a9d3f','#e0627f'];
function line(v,lb){const W=320,H=130,P=6,mx=Math.max(...v,1),n=v.length-1||1,pt=v.map((y,i)=>[P+i*(W-2*P)/n,H-P-(y/mx)*(H-2*P)]);
 const d=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 return `<svg viewBox="0 0 ${W} ${H+16}" width="100%"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0e9a8a" stop-opacity=".4"/><stop offset="1" stop-color="#0e9a8a" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W-P} ${H-P}L${P} ${H-P}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#0e9a8a" stroke-width="2.5" stroke-linejoin="round"/><text class="t" x="${P}" y="${H+12}">${lb[0]}</text><text class="t" x="${W-P}" y="${H+12}" text-anchor="end">${lb[1]}</text></svg>`}
function donut(it){const T=it.reduce((s,x)=>s+x.v,0);if(!T)return '<p class="mu">Inga skulder ännu.</p>';const R=54,C=2*Math.PI*R;let off=0;
 const sg=it.map((x,i)=>{const l=x.v/T*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${COL[i%7]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return s}).join('');
 return `<div class="row"><svg viewBox="0 0 140 140" width="130" height="130" style="flex:none">${sg}<text x="70" y="68" text-anchor="middle" class="t">Totalt</text><text x="70" y="84" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--tx)">${kr(T)}</text></svg><div>${it.map((x,i)=>`<div class="mu"><i class="dot" style="background:${COL[i%7]}"></i>${esc(x.n)} · ${Math.round(x.v/T*100)}%</div>`).join('')}</div></div>`}
/* ---------- Vyer ---------- */
function vOv(){const all=DB.people.flatMap(p=>p.debts),s=series(all);
 return `<h1>Översikt</h1><div class="card hero"><div class="mu">Total skuld</div><div class="big">${kr(s.v[0])}</div><div class="row sp" style="margin-top:10px"><div><div class="mu">Per månad</div><b>${kr(DB.people.reduce((a,p)=>a+mon(p),0))}</b></div><div style="text-align:right"><div class="mu">Skuldfri</div><b>${s.bad||!s.v[0]?'–':end(s.n)}</b></div></div></div>
<div class="card"><h2>Skuld per person</h2>${donut(DB.people.map(p=>({n:p.name,v:tot(p)})).filter(x=>x.v>0))}</div>
<div class="card"><h2>Skuldutveckling</h2>${s.v[0]>0?line(sm(s.v),['Nu',s.bad?'':end(s.n)]):'<p class="mu">Lägg till en skuld under Personer för att se diagram.</p>'}${s.bad?'<p class="mu" style="color:var(--dg)">Minst en månadsbetalning täcker inte räntan.</p>':''}<p class="mu">Beräknad ränta kvar: <b>${kr(s.t)}</b></p></div>`}
function vPe(){return `<h1>Personer</h1>${DB.people.map(p=>`<div class="card row" data-a="op" data-id="${p.id}"><div class="av">${esc(p.name.slice(0,1).toUpperCase())}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="mu">${p.debts.length} skulder · ${kr(mon(p))}/mån</div></div><b>${kr(tot(p))}</b></div>`).join('')}<button class="btn" data-a="np">+ Lägg till person</button>`}
function debtCard(p,d){const pl=plan(d),op=S.open==d.id;
 return `<div class="card"><div class="row sp"><b>${esc(d.name)}</b><b>${kr(d.amount)}</b></div><div class="mu">${esc(d.rate)} % ränta · ${kr(d.pay)}/mån</div>
${pl.ok?`<div class="mu">${d.amount>0?'Klar '+end(pl.r.length)+' · ':''}Ränta kvar ${kr(pl.t)}</div>`:'<div class="mu" style="color:var(--dg)">Betalningen täcker inte räntan.</div>'}
<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="chip" data-a="pay" data-id="${p.id}" data-d="${d.id}">Betala</button><button class="chip" data-a="pl" data-d="${d.id}">${op?'Dölj plan':'Avbetalningsplan'}</button><button class="chip" data-a="ed" data-id="${p.id}" data-d="${d.id}">Ändra</button></div>
${op&&pl.ok&&pl.r.length?`<div class="tw"><table><tr><th>Månad</th><th>Ränta</th><th>Amortering</th><th>Rest</th></tr>${pl.r.map(r=>`<tr><td>${r.d.toLocaleDateString('sv-SE',{month:'short',year:'2-digit'})}</td><td>${Math.round(r.i)}</td><td>${Math.round(r.a)}</td><td>${Math.round(r.b)}</td></tr>`).join('')}</table></div>`:''}</div>`}
function vPd(){const p=DB.people.find(x=>x.id==S.pid);if(!p){S.pid=null;return vPe()}const s=series(p.debts);
 return `<div class="row sp"><button class="lk" data-a="bk">‹ Tillbaka</button><button class="lk" data-a="ep" data-id="${p.id}">Redigera</button></div><h1>${esc(p.name)}</h1>
<div class="card hero"><div class="mu">Total skuld</div><div class="big">${kr(s.v[0])}</div><div class="mu">${kr(mon(p))} per månad${p.inc?' · Kvar av inkomst '+kr(p.inc-mon(p)):''}</div></div>
${p.info?`<div class="card"><h2>Information</h2><div style="white-space:pre-wrap">${esc(p.info)}</div></div>`:''}
${p.debts.length?`<div class="card"><h2>Fördelning</h2>${donut(p.debts.map(d=>({n:d.name,v:+d.amount})).filter(x=>x.v>0))}</div><div class="card"><h2>Skuldutveckling</h2>${s.v[0]>0?line(sm(s.v),['Nu',s.bad?'':end(s.n)]):'<p class="mu">Skuldfri.</p>'}</div>`:''}
${p.debts.map(d=>debtCard(p,d)).join('')}<button class="btn" data-a="nd" data-id="${p.id}">+ Ny skuld</button>`}
function vNo(){return `<h1>Anteckningar</h1>${DB.notes.length?[...DB.notes].sort((a,b)=>b.d-a.d).map(n=>`<div class="card" data-a="en" data-id="${n.id}"><b>${esc(n.t||'Utan titel')}</b><div class="mu">${new Date(n.d).toLocaleDateString('sv-SE')}</div><div class="cl">${esc(n.x)}</div></div>`).join(''):'<p class="mu">Inga anteckningar ännu. Tryck på + för att skriva din första.</p>'}<button class="fab" data-a="nn" aria-label="Ny anteckning">+</button>`}
function vTd(){const a=DB.todos,dn=a.filter(t=>t.done).length,pc=a.length?Math.round(dn/a.length*100):0,L=[...a].sort((x,y)=>(x.done-y.done)||(x.due||'9').localeCompare(y.due||'9'));
 return `<h1>Att göra</h1><div class="card"><div class="row sp"><b>${dn} av ${a.length} klara</b><span class="mu">${pc} %</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>
<div class="card"><input id="tt" placeholder="Ny uppgift…" maxlength="200"><input id="td" type="date"><button class="btn" data-a="at" style="margin-top:0">Lägg till</button></div>
${L.map(t=>{const od=!t.done&&t.due&&t.due<today();return `<div class="card row todo ${t.done?'dn':''}"><button class="ck ${t.done?'on':''}" data-a="tg" data-id="${t.id}" aria-label="Klar">${t.done?'✓':''}</button><div style="flex:1"><div class="tx">${esc(t.t)}</div>${t.due?`<div class="mu" style="${od?'color:var(--dg)':''}">${esc(t.due)}${od?' · försenad':''}</div>`:''}</div><button class="x" data-a="dt" data-id="${t.id}" aria-label="Ta bort">✕</button></div>`}).join('')}`}
function vSe(){return `<h1>Inställningar</h1><div class="card"><h2>Säkerhet</h2><p class="mu">All data krypteras med AES‑256 (nyckel från ditt lösenord, PBKDF2 med 600 000 varv) och sparas bara på den här enheten – inget skickas till någon server. Appen låser sig efter 2 minuters inaktivitet eller när du lämnar den en stund. Väntetid införs vid felaktiga försök.</p><button class="btn" data-a="lk">Lås nu</button></div>
<div class="card"><h2>Säkerhetskopia</h2><p class="mu">Kopian är krypterad och kan bara öppnas med ditt lösenord. Gör en kopia regelbundet – om webbläsarens data rensas finns annars inget kvar.</p><div class="row"><button class="chip" data-a="ex">Visa / kopiera</button><button class="chip" data-a="im">Återställ</button></div></div>
<div class="card"><h2>Radera</h2><button class="btn dg" data-a="wp" style="margin-top:0">Radera all data</button></div>`}
function render(){if(!KEY)return;const v={ov:vOv,pe:S.pid?vPd:vPe,no:vNo,td:vTd,se:vSe}[S.tab];
 $('app').innerHTML=(memOnly?'<div class="card" style="color:var(--dg)">Webbläsaren blockerar lagring – data sparas inte. Öppna länken i Safari eller Chrome.</div>':'')+v();
 $('nav').innerHTML=TABS.map(([k,l,p])=>`<button data-a="tab" data-id="${k}" class="${S.tab==k?'on':''}">${ic(p,22)}<span>${l}</span></button>`).join('')}
/* ---------- Formulär (bottom sheet) ---------- */
function sheet(t,f,ok,cb,del){const o=document.createElement('div');o.className='ovl';
 o.innerHTML=`<div class="sh"><div class="row sp"><h2>${t}</h2><button class="x" data-c aria-label="Stäng">✕</button></div>${f.map(x=>x.t=='msg'?`<p class="mu">${x.l}</p>`:`<label>${x.l}${x.t=='area'?`<textarea name="${x.k}" rows="${x.r||4}">${esc(x.v)}</textarea>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v)}" ${x.n?'inputmode="decimal"':''} autocomplete="off">`}</label>`).join('')}<div class="err"></div><button class="btn" data-s>${ok}</button>${del?'<button class="btn dg" data-del>Ta bort</button>':''}</div>`;
 document.body.appendChild(o);
 o.onclick=async e=>{const b=e.target;if(b===o||b.dataset.c!==undefined)o.remove();
  else if(b.dataset.s!==undefined){b.disabled=true;const v=Object.fromEntries([...o.querySelectorAll('[name]')].map(i=>[i.name,i.value])),r=await cb(v);b.disabled=false;if(r)o.querySelector('.err').textContent=r;else o.remove()}
  else if(b.dataset.del!==undefined){del();o.remove()}}}
function pform(p){sheet(p?'Redigera person':'Ny person',[{k:'name',l:'Namn',v:p?.name},{k:'inc',l:'Månadsinkomst, kr (valfritt)',v:p?.inc||'',n:1},{k:'info',l:'Information (telefon, relation, anteckningar)',t:'area',v:p?.info}],'Spara',v=>{if(!v.name.trim())return 'Ange ett namn.';const o={name:v.name.trim(),inc:num(v.inc),info:v.info};if(p)Object.assign(p,o);else DB.people.push({id:uid(),...o,debts:[]});save();render()},p&&p.id!='me'?()=>{DB.people=DB.people.filter(x=>x!==p);S.pid=null;save();render()}:null)}
function dform(p,d){sheet(d?'Ändra skuld':'Ny skuld',[{k:'name',l:'Namn (t.ex. Banklån)',v:d?.name},{k:'amount',l:'Nuvarande skuld (kr)',v:d?.amount||'',n:1},{k:'rate',l:'Ränta (% per år)',v:d?.rate??'',n:1},{k:'pay',l:'Betalning per månad (kr)',v:d?.pay||'',n:1}],'Spara',v=>{const o={name:v.name.trim(),amount:num(v.amount),rate:num(v.rate),pay:num(v.pay)};if(!o.name||o.amount<=0||o.pay<=0)return 'Fyll i namn, skuld och månadsbetalning.';if(d)Object.assign(d,o);else p.debts.push({id:uid(),...o});save();render()},d?()=>{p.debts=p.debts.filter(x=>x!==d);save();render()}:null)}
function nform(n){sheet(n?'Anteckning':'Ny anteckning',[{k:'t',l:'Titel',v:n?.t},{k:'x',l:'Dina tankar',t:'area',r:9,v:n?.x}],'Spara',v=>{if(!v.t.trim()&&!v.x.trim())return 'Skriv något först.';if(n)Object.assign(n,{t:v.t,x:v.x,d:Date.now()});else DB.notes.push({id:uid(),t:v.t,x:v.x,d:Date.now()});save();render()},n?()=>{DB.notes=DB.notes.filter(x=>x!==n);save();render()}:null)}
/* ---------- Händelser ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!KEY)return;const a=b.dataset.a,id=b.dataset.id,did=b.dataset.d,P=()=>DB.people.find(p=>p.id==id);
 const A={
 tab:()=>{S.tab=id;S.pid=null;scrollTo(0,0)},op:()=>{S.pid=id;scrollTo(0,0)},bk:()=>{S.pid=null},
 np:()=>{pform();return false},ep:()=>{pform(P());return false},nd:()=>{dform(P());return false},ed:()=>{dform(P(),P().debts.find(d=>d.id==did));return false},
 pl:()=>{S.open=S.open==did?null:did},
 pay:()=>{const d=P().debts.find(x=>x.id==did);sheet('Registrera inbetalning',[{t:'msg',l:esc(d.name)+' · nuvarande skuld '+kr(d.amount)},{k:'v',l:'Belopp (kr)',v:'',n:1}],'Registrera',v=>{const n=num(v.v);if(n<=0)return 'Ange ett belopp.';d.amount=Math.max(0,d.amount-n);save();render()});return false},
 nn:()=>{nform();return false},en:()=>{nform(DB.notes.find(n=>n.id==id));return false},
 at:()=>{const t=$('tt').value.trim();if(!t)return false;DB.todos.push({id:uid(),t,due:$('td').value,done:false});save();render();return false},
 tg:()=>{const t=DB.todos.find(x=>x.id==id);t.done=!t.done;return 1},dt:()=>{DB.todos=DB.todos.filter(x=>x.id!=id);return 1},
 lk:()=>{lock();return false},
 ex:()=>{sheet('Säkerhetskopia (krypterad)',[{t:'msg',l:'Kopiera texten och spara den säkert. Den kan bara öppnas med ditt lösenord.'},{k:'v',l:'',t:'area',r:6,v:ls.get('fm_v')||''}],'Kopiera',async()=>{try{await navigator.clipboard.writeText(ls.get('fm_v')||'')}catch(x){return 'Kunde inte kopiera automatiskt – markera texten och kopiera manuellt.'}});return false},
 im:()=>{sheet('Återställ från kopia',[{t:'msg',l:'Ersätter nuvarande data på den här enheten.'},{k:'v',l:'Klistra in kopian',t:'area',r:5},{k:'p',l:'Lösenord för kopian',t:'password'}],'Återställ',async v=>{try{const r=await unseal(v.p,JSON.parse(v.v.trim()));KEY=r.k;SALT=r.s;IT=r.it;DB=r.db;await seal();render()}catch(x){return 'Fel lösenord eller ogiltig kopia.'}});return false},
 wp:()=>{sheet('Radera all data',[{t:'msg',l:'Allt raderas permanent från den här enheten. Skriv RADERA för att bekräfta.'},{k:'c',l:'Bekräftelse',v:''}],'Radera',v=>{if(v.c!=='RADERA')return 'Skriv RADERA.';try{['fm_v','fm_f','fm_u'].forEach(k=>localStorage.removeItem(k))}catch(x){}KEY=null;DB=null;lockUI()});return false}
 };
 const r=await A[a]();if(r!==false){if(r)save();render()}});
/* ---------- Autolås & integritet ---------- */
['pointerdown','keydown','scroll'].forEach(t=>addEventListener(t,()=>last=Date.now(),{passive:true}));
setInterval(()=>{if(KEY&&Date.now()-last>12e4)lock()},5000);
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('hid',document.hidden);if(document.hidden)hidAt=Date.now();else if(KEY&&Date.now()-hidAt>30000)lock()});
lockUI();
</script></body></html>
